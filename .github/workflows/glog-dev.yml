name: Glog Scan (dev)
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  security-events: write

jobs:
  glog-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
              distribution: 'temurin'
              java-version: 23
              architecture: x64
      - name: Build with Maven
        run: mvn --no-transfer-progress verify -DskipTests

      - name: Checkout glog-action repository
        uses: actions/checkout@v4
        with:
          repository: glogai/glog-action
          token: ${{ secrets.PAT_TOKEN }}
          path: .github/glog-action
          ref: main

      - name: Run Glog.AI
        uses: ./.github/glog-action
        with:
          client: 'swissdemo'
          github-token: ${{ secrets.PAT_TOKEN }}
          glog-token: ${{ secrets.GLOG_TOKEN }}
          upload: 'true'
          on-prem-upload: 'true'
          issue: 'false'
          autofix: 'false'
          sarif-format-type: 'GITHUB'
          server-sarif-format-type: 'STANDARD'
          sbom: 'true'
          supply-chain: 'true'
          rebuild: 'true'
          rebuild-max-packages: '25'
          env: 'dev'
          scl-uuid: 'ccd5bc79-045b-465a-8ec4-4d5c8683a99b'

